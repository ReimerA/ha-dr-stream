name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches new Home Assistant/HACS rules even without code changes.
    - cron: "0 6 * * 1"
  workflow_call:

jobs:
  hassfest:
    # Home Assistant's own checker: manifest, translations, config flow, ...
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The checks HACS runs before it accepts a repository.
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" wants a logo in home-assistant/brands. Remove this line
          # once logos are added (needed for the HACS default list).
          ignore: brands
